<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Up arrow -->
    <line x1="-50" y1="25" x2="-50" y2="-80"/>
    <polyline points="-90,-40 -50,-80 -10,-40"/>
    <!-- Down arrow -->
    <line x1="50" y1="-25" x2="50" y2="80"/>
    <polyline points="10,40 50,80 90,40"/>
  </g>
</svg>
