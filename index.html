      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

        html { background-color: #0E0E0E; color: #F5F5F5; }

      [data-theme="light"] { background-color: #FAFAFA; color: #111; }
      [data-theme="dark"] { background-color: #0E0E0E; color: #F5F5F5; }
