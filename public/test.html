<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LocalDrop E2E Test</title>
</head>
<body>
  <h1>LocalDrop E2E Test Page</h1>
  <div id="status">Initializing...</div>
  
  <script type="module">
    // Inline the signaling module for testing
    function base64urlEncode(data) {
      const base64 = btoa(String.fromCharCode(...data));
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64urlDecode(str) {
      let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4 !== 0) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function parseSDP(sdp, type) {
      const lines = sdp.split('\r\n');
      let iceUfrag = '', icePwd = '', fingerprint = '', setup = '';
      const candidates = [];
      
      for (const line of lines) {
        if (line.startsWith('a=ice-ufrag:')) {
          iceUfrag = line.substring('a=ice-ufrag:'.length);
        } else if (line.startsWith('a=ice-pwd:')) {
          icePwd = line.substring('a=ice-pwd:'.length);
        } else if (line.startsWith('a=fingerprint:sha-256 ')) {
          const fp = line.substring('a=fingerprint:sha-256 '.length);
          fingerprint = fp.replace(/:/g, '').toUpperCase();
        } else if (line.startsWith('a=setup:')) {
          setup = line.substring('a=setup:'.length);
        } else if (line.startsWith('a=candidate:')) {
          const afterPrefix = line.substring('a=candidate:'.length);
          const parts = afterPrefix.split(' ');
          if (parts.length >= 8) {
            const foundation = parts[0];
            const priority = parseInt(parts[3], 10);
            const address = parts[4];
            const port = parseInt(parts[5], 10);
            const candType = parts[7];
            if (candType === 'host' && !address.startsWith('fe80:')) {
              candidates.push([foundation, address, port, priority]);
              if (candidates.length >= 3) break;
            }
          }
        }
      }
      
      return { v: 1, t: type, u: iceUfrag, p: icePwd, f: fingerprint, s: setup, c: candidates };
    }

    function formatFingerprint(hex) {
      const upper = hex.toUpperCase();
      const pairs = [];
      for (let i = 0; i < upper.length; i += 2) {
        pairs.push(upper.substring(i, i + 2));
      }
      return pairs.join(':');
    }

    function rebuildSDP(descriptor) {
      const sessionId = Math.floor(Math.random() * 1e9);
      const fingerprintFormatted = formatFingerprint(descriptor.f);
      const lines = [
        'v=0',
        `o=- ${sessionId} 2 IN IP4 127.0.0.1`,
        's=-',
        't=0 0',
        'a=group:BUNDLE 0',
        'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
        'c=IN IP4 0.0.0.0',
        'a=ice-ufrag:' + descriptor.u,
        'a=ice-pwd:' + descriptor.p,
        'a=fingerprint:sha-256 ' + fingerprintFormatted,
        'a=setup:' + descriptor.s,
        'a=mid:0',
        'a=sctp-port:5000',
        'a=max-message-size:262144',
      ];
      for (const [foundation, ip, port, priority] of descriptor.c) {
        lines.push(`a=candidate:${foundation} 1 udp ${priority} ${ip} ${port} typ host`);
      }
      return lines.join('\r\n') + '\r\n';
    }

    function encodePayload(descriptor) {
      const json = JSON.stringify(descriptor);
      return base64urlEncode(new TextEncoder().encode(json));
    }

    function decodePayload(encoded) {
      const bytes = base64urlDecode(encoded);
      const json = new TextDecoder().decode(bytes);
      return JSON.parse(json);
    }

    function createOfferPayload(sdp) {
      const descriptor = parseSDP(sdp, 'o');
      return encodePayload(descriptor);
    }

    function createAnswerPayload(sdp) {
      const descriptor = parseSDP(sdp, 'a');
      return encodePayload(descriptor);
    }

    // Expose functions on window for Playwright
    window.testAPI = {
      parseSDP,
      rebuildSDP,
      encodePayload,
      decodePayload,
      createOfferPayload,
      createAnswerPayload,
    };

    document.getElementById('status').textContent = 'Ready';
  </script>
</body>
</html>
